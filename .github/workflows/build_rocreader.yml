name: Build ROCreader for RGDS Plus

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell
        run: |
          # 这是一个 PowerShell 脚本，所以我们需要在 Ubuntu 里装上它
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Build with Author's Script
        run: |
          # 进入 RGDSPlus 目录
          cd RGDSPlus
          # 运行作者提供的构建脚本
          pwsh build_rgds_plus_official.ps1
          
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rocreader-rgds-plus-official
          path: |
            build/rocreader_sdl
            rgds_plus/build/rocreader_sdl
          if-no-files-found: warn
