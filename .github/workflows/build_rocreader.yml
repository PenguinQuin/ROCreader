name: Build ROCreader
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Toolchain
        run: docker build -t rocreader-toolchain H700/toolchain

      - name: Compile with H700 Low Glibc
        run: |
          # 使用原作者的构建脚本逻辑进行编译
          docker run --rm -v "${GITHUB_WORKSPACE}:/work" -w /work rocreader-toolchain bash ./cross_compile_low_glibc.sh

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rocreader-sdl-custom
          path: |
            rocreader_sdl
            Downloads/*.zip
