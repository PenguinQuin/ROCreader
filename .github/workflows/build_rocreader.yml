name: Build Binary

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          # 不使用脚本，直接 make，但增加静态链接参数，尝试把库包进去
          # 这通常能解决闪退问题
          make clean
          make LDFLAGS="-static-libgcc -static-libstdc++"
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rocreader-final
          path: build/rocreader_sdl
