name: Build ROCreader for ARM64 (Native)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 关键点：直接使用 ARM64 原生环境
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # 因为是 ARM64 原生环境，这里直接安装普通的库就行，不会再报错了
          sudo apt-get install -y build-essential libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev libzip-dev

      - name: Build Binary
        run: |
          # 因为是原生 ARM 环境，直接 make 即可，不需要任何交叉编译参数
          make clean
          make

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rocreader-arm64-native
          path: |
            rocreader_sdl
            ROCreader
            build/rocreader_sdl
          if-no-files-found: error
