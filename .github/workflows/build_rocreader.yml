name: Build ROCreader for ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # 使用包含 ARM64 交叉编译工具链的容器
    container:
      image: rustcross/aarch64-unknown-linux-gnu:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libsdl2-dev:arm64 libsdl2-image-dev:arm64 libsdl2-ttf-dev:arm64 libsdl2-mixer-dev:arm64 libzip-dev:arm64
          # 注意：这里可能需要手动链接或设置 PKG_CONFIG_PATH，如果编译报错，请把错误日志发给我

      - name: Build Binary
        run: |
          # 强制指定编译器为 aarch64 的编译器
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          
          make clean
          make

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rocreader-arm64
          path: |
            rocreader_sdl
            ROCreader
            build/rocreader_sdl
          if-no-files-found: warn
