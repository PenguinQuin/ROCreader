name: Build ROCreader for ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cross-Compiler
        run: |
          sudo apt-get update
          # 只安装交叉编译器，不安装有争议的 arm64 库
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Binary
        run: |
          # 告诉 Makefile 我们是在做交叉编译
          # 确保编译器是 aarch64-linux-gnu-g++
          make clean
          make CXX=aarch64-linux-gnu-g++ CC=aarch64-linux-gnu-gcc

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rocreader-arm64
          path: |
            rocreader_sdl
            ROCreader
            build/rocreader_sdl
          if-no-files-found: warn
