name: Build ROCreader
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev libzip-dev

      - name: Build Binary
        run: |
          # 编译程序
          make clean
          make

      - name: Debug - List files
        run: |
          echo "正在搜索可执行文件..."
          find . -maxdepth 3 -executable -type f
          echo "--- 当前目录结构 ---"
          ls -R

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rocreader-sdl-custom
          # 增加多个可能存在的路径
          path: |
            rocreader_sdl
            ROCreader
            bin/rocreader_sdl
            build/rocreader_sdl
            ./rocreader_sdl
          if-no-files-found: warn
