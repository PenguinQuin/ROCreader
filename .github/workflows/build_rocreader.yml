name: Build ROCreader
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev libzip-dev

      - name: Build Binary
        run: |
          # 直接使用项目自带的 Makefile 进行编译
          make clean
          make

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rocreader-sdl-custom
          path: rocreader_sdl
