name: Build ROCreader for ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cross-Compiler
        run: |
          sudo apt-get update
          # 安装 ARM64 交叉编译器
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # 我们尝试安装对应的开发库（如果提示找不到，我们会再调整）
          # 对于许多掌机项目，通常使用内置的 sysroot 或静态链接，我们先尝试标准路径
          sudo apt-get install -y libsdl2-dev:arm64 libsdl2-image-dev:arm64 libsdl2-ttf-dev:arm64 libsdl2-mixer-dev:arm64 libzip-dev:arm64

      - name: Build Binary
        run: |
          # 明确指定编译器为 aarch64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          
          # 使用 make 指定编译器变量
          make clean
          make CXX=$CXX CC=$CC

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rocreader-arm64
          path: |
            rocreader_sdl
            ROCreader
            build/rocreader_sdl
          if-no-files-found: warn
