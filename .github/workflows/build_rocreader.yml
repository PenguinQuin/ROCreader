name: Build ROCreader for ARM64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with dockcross
        run: |
          # 1. 获取 dockcross 脚本
          docker run --rm dockcross/linux-armv8 > ./dockcross
          chmod +x ./dockcross
          
          # 2. 使用 dockcross 环境进行编译
          # 它是预配置好的环境，自动包含了 arm64 的 SDL2 等库
          ./dockcross make clean
          ./dockcross make
          
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rocreader-arm64
          path: |
            build/rocreader_sdl
            rocreader_sdl
          if-no-files-found: warn
